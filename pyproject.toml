[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlnn-xai-project"
version = "0.1.0"
description = "Avaliação comparativa da fidelidade de métodos de XAI post-hoc em ViG-Ti vs. DeiT-Tiny no Imagenette."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Henrique Coelho Beltrão", email = "riquecbeltrao@hotmail.com" },
]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scikit-image>=0.22",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "lime>=0.2.0.1",
    "shap>=0.45",
    "captum>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
